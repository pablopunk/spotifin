workflows:
  testflight:
    name: Spotifin TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 120
    integrations:
      app_store_connect: Spotifin App Store Connect
    environment:
      flutter: 3.47.3
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.pablopunk.spotifin
    triggering:
      events: [push, tag]
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Dependencies
        script: flutter pub get
      - name: Analyze
        script: flutter analyze
      - name: Test
        script: flutter test
      - name: Configure signing
        script: xcode-project use-profiles
      - name: Build IPA
        script: flutter build ipa --release --build-number=$PROJECT_BUILD_NUMBER --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
