name: Check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  flutter:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.3
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build
      - run: flutter analyze
      - run: flutter test
      - run: flutter test --platform chrome test/session_store_test.dart
      - run: flutter build web --release
      - run: flutter build ios --release --no-codesign
