name: Check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  flutter:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.47.3
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - run: flutter test --platform chrome test/session_store_test.dart test/database_startup_test.dart test/artwork_store_web_test.dart
      - name: Build web from the files Vercel receives
        run: bash scripts/build-web-from-vercel-files.sh "$RUNNER_TEMP/vercel-files"
      - name: WebKit service worker smoke test
        working-directory: tool/web_smoke
        env:
          WEB_BUILD_DIR: ${{ runner.temp }}/vercel-files/build/web
        run: |
          npm ci
          npx playwright install webkit
          npx playwright test
      - run: flutter build ios --release --no-codesign
