flutter_launcher_icons:
  image_path: assets/branding/app_icon.png
  android: true
  min_sdk_android: 21
  adaptive_icon_background: "#06182F"
  adaptive_icon_foreground: assets/branding/app_icon.png
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#06182F"
  web:
    generate: true
    image_path: assets/branding/app_icon.png
    background_color: "#06182F"
    theme_color: "#06182F"
  windows:
    generate: true
    image_path: assets/branding/app_icon.png
    icon_size: 256
  macos:
    generate: true
    image_path: assets/branding/app_icon.png
